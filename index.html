<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard</title>
    <style>
        .table{
            background: #000;
            color: white;
            border-color: aqua;
            border-spacing: 8px;
        }
        .space{
            height: 50px;
            width: 50px;
            padding-left: 30px;
        }
        .tab{
            padding-left: 5px;
        }
        .pu{
            padding-left: 17px;
        }
        .pd{
            padding-left:8px;
        }
        .img{
            height: 50px;
            padding-left: 15px;
        }
        .h1{
            text-align: center;
            color: aqua;
            background: #000;
        }
        .win{
            height: 30px;
        
        }
        .centre{
            padding-left: 30px;
        }
    </style>
</head>
<body>
    <h1 class="h1">KEYBOARD BY ABDUL BASIT</h1>
    <table class="table" border="2px">
        <tr>
            <td class="space">`</td>
            <td class="space">1</td>
            <td class="space">2</td>
            <td class="space">3</td>
            <td class="space">4</td>
            <td class="space">5</td>
            <td class="space">6</td>
            <td class="space">7</td>
            <td class="space">8</td>
            <td class="space">9</td>
            <td class="space">0</td>
            <td class="space">-</td>
            <td class="space">=</td>
            <td colspan="2">backspace</td>
        </tr>
        <tr>
            <td class="tab">tab</td>
            <td class="space">Q</td>
            <td class="space">W</td>
            <td class="space">E</td>
            <td class="space">R</td>
            <td class="space">T</td>
            <td class="space">Y</td>
            <td class="space">U</td>
            <td class="space">I</td>
            <td class="space">O</td>
            <td class="space">P</td>
            <td class="space">[</td>
            <td class="space">]</td>
            <td class="space">\</td>
        </tr>
         <tr>
            <td class="tab">capslock</td>
            <td class="space">A</td>
            <td class="space">S</td>
            <td class="space">D</td>
            <td class="space">F</td>
            <td class="space">G</td>
            <td class="space">H</td>
            <td class="space">J</td>
            <td class="space">K</td>
            <td class="space">L</td>
            <td class="centre">;</td>
            <td class="centre">'</td>
            <td colspan="2" class="tab">enter</td>
            
        </tr>
        <tr>
            <td class="tab" colspan="2">shift</td>
            <td class="space">Z</td>
            <td class="space">X</td>
            <td class="space">C</td>
            <td class="space">V</td>
            <td class="space">B</td>
            <td class="space">N</td>
            <td class="space">M</td>
            <td class="centre">,</td>
            <td class="centre">.</td>
            <td class="centre">/</td>
            <td colspan="2" class="tab">shift</td>
        </tr>
        <tr>
            <td class="tab"> ctrl</td>
            <td class="space">fn</td>
            <td class="space">
                <img class="win" src="/assets/56e649e0a9f64715c67086a552db745a.jpg" alt="">
            </td>
            <td class="space">alt</td>
            <td colspan="5"></td>
            <td class="space">alt</td>
            <td class="space">ctrl</td>
            <td class="pu">pageup</td>
            <td>
                <img class="img" src="/assets/download.png" alt="">
            </td>
            <td class="pd">pagedown</td>
            
        </tr>
        
    </table>
</body>
</html>
